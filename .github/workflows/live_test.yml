name: "Live Integration Tests [SEED: 2399 Native Stealth]"

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  live-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (Ubuntu 24.04/22.04 Compatible)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpangocairo-1.0-0 libgtk-3-0t64 libasound2t64 libcurl4-openssl-dev python3-dev || \
          sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpangocairo-1.0-0 libgtk-3-0 libasound2 libcurl4-openssl-dev python3-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-asyncio pytest-cov
          pip install -e .
          pip install "camoufox[geoip]>=0.4.0" "curl-cffi>=0.6.2" "playwright>=1.42.0"
          playwright install chromium

      - name: Fetch Camoufox Browser
        run: python -m camoufox fetch || echo "Camoufox fetch completed"

      - name: Run Live Integration Tests
        run: pytest tests/integration/test_live_ingest.py tests/integration/test_live_crawl.py --run-live -v --tb=short
